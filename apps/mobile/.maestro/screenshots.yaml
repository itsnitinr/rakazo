appId: com.rakazo.app
name: Android keyboard fix capture
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- tapOn: "Sign in"
- assertVisible: "Sign in to Rakazo"
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 30000
- tapOn: "Message Researcher"
- inputText: "Keyboard visibility check"
- assertVisible: "Keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "15d-thread-keyboard"
- eraseText
- hideKeyboard
- openLink: "rakazo:///group-thread?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 30000
- tapOn: "Message Launch team"
- inputText: "Group keyboard visibility check"
- assertVisible: "Group keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "19b-group-thread-keyboard"
